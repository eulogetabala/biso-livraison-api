# Render FREE — repo biso-livraison-api (backend seul)
# Branch : main
#
# Après deploy, renseigner dans le dashboard :
#   CORS_ORIGINS = https://votre-dashboard.onrender.com
#   TWILIO_* (Verify obligatoire en prod)

databases:
  - name: biso-db
    plan: free
    databaseName: delivery_db
    user: biso

services:
  - type: web
    name: biso-api
    runtime: node
    plan: free
    healthCheckPath: /health
    # Le build NE DOIT PAS toucher la base : sinon un P1001 (DB momentanément
    # injoignable) fait échouer tout le déploiement. La synchro du schéma se
    # fait au démarrage (startCommand), de façon non bloquante.
    buildCommand: npm install --omit=peer && npx prisma generate && NODE_OPTIONS=--max-old-space-size=2048 npm run build
    # db push est tenté à chaque démarrage mais n'empêche PAS l'app de booter :
    # le boot résilient expose /health en "degraded" tant que la base est down,
    # et le schéma sera resynchronisé au prochain redémarrage une fois la DB OK.
    startCommand: (npx prisma db push || echo "⚠️  prisma db push a échoué (base injoignable) — démarrage en mode dégradé"); node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: biso-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: DB_POOL_MAX
        value: "3"
      - key: UPLOAD_DIR
        value: public/uploads
      - key: PUBLIC_UPLOAD_URL
        value: /uploads
      # Cloudinary — persistance des images (sans ça, disque éphémère Render :
      # images perdues à chaque redeploy). Le cloud name n'est pas un secret.
      # Les 3 premières doivent être définies ENSEMBLE (sinon retour au disque).
      - key: CLOUDINARY_CLOUD_NAME
        value: dscib2mxz
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: biso-livraison
      - key: ALLOW_TEST_OTP
        value: "false"
      - key: THROTTLE_DEFAULT_LIMIT
        value: "120"
      - key: THROTTLE_DEFAULT_TTL_MS
        value: "60000"
      - key: CORS_ORIGINS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
