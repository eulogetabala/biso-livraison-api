# Évite le sleep Render free tier (~15 min sans trafic → cold start 30–60 s).
# Ping /health toutes les 5 minutes (minimum GitHub Actions).

name: Keep Render API alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping biso-api health (with retries for cold start)
        run: |
          URL="https://biso-api.onrender.com/health"
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 "$URL"; then
              echo "OK (attempt $attempt)"
              exit 0
            fi
            echo "Retry in 20s..."
            sleep 20
          done
          echo "Health check failed after 3 attempts"
          exit 1
